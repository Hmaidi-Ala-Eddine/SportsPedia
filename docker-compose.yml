services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: sportspedia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-sportspedia123}
      MYSQL_DATABASE: ${DB_NAME:-sportspedia}
      MYSQL_USER: ${DB_USER:-sportspedia}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sportspedia123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sportspedia-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apache Jena Fuseki
  fuseki:
    image: stain/jena-fuseki:latest
    container_name: sportspedia-fuseki
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${FUSEKI_PASSWORD:-admin123}
      JVM_ARGS: "-Xmx2g"
    ports:
      - "3030:3030"
    volumes:
      - fuseki_data:/fuseki
      - ./ontology:/staging
      - ./fuseki/configuration:/fuseki/configuration
    networks:
      - sportspedia-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/$/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ollama AI Service
  ollama:
    image: ollama/ollama:latest
    container_name: sportspedia-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - sportspedia-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sportspedia-backend
    restart: unless-stopped
    environment:
      # App Configuration
      APP_NAME: "SportsPedia API"
      DEBUG: "True"
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      
      # Database Configuration
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-sportspedia}
      DB_PASSWORD: ${DB_PASSWORD:-sportspedia123}
      DB_NAME: ${DB_NAME:-sportspedia}
      
      # JWT Configuration
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      
      # Fuseki Configuration
      FUSEKI_ENDPOINT: "http://fuseki:3030/sportspedia/query"
      
      # Ollama Configuration
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "llama3.2:3b"
      
      # CORS Configuration
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000", "http://localhost", "http://localhost:80"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./ontology/sportspedia_final.rdf:/app/data/sportspedia_final.rdf
    depends_on:
      mysql:
        condition: service_healthy
      fuseki:
        condition: service_healthy
    networks:
      - sportspedia-network
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000/api
        - VITE_FUSEKI_ENDPOINT=http://localhost:3030/sportspedia
    container_name: sportspedia-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - sportspedia-network

networks:
  sportspedia-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  fuseki_data:
    driver: local
  ollama_data:
    driver: local
