version: '3.8'

services:
  # Apache Jena Fuseki - SPARQL Server
  fuseki:
    image: stain/jena-fuseki:latest
    container_name: sportspedia-fuseki
    ports:
      - "3030:3030"
    environment:
      - ADMIN_PASSWORD=admin123
      - JVM_ARGS=-Xmx4g
    volumes:
      - ./fuseki/configuration:/fuseki/configuration
      - ./fuseki/data:/fuseki/databases
      - ./sportspedia_final.rdf:/fuseki/ontology/sportspedia_final.rdf
    networks:
      - sportspedia-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/$/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sportspedia-backend
    ports:
      - "8000:8000"
    environment:
      - FUSEKI_ENDPOINT=http://fuseki:3030/sportspedia/query
      - FUSEKI_UPDATE_ENDPOINT=http://fuseki:3030/sportspedia/update
      - FUSEKI_GRAPH_STORE=http://fuseki:3030/sportspedia/data
    volumes:
      - ./backend:/app
    depends_on:
      fuseki:
        condition: service_healthy
    networks:
      - sportspedia-network
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sportspedia-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - sportspedia-network
    restart: unless-stopped
    command: npm run dev -- --host

networks:
  sportspedia-network:
    driver: bridge

volumes:
  fuseki-data:
